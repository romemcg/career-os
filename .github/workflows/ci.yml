name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros_ci
          POSTGRES_DB: careeros
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careeros:careeros_ci@127.0.0.1:5432/careeros
      TEST_DATABASE_URL: postgresql://careeros:careeros_ci@127.0.0.1:5432/careeros_test
      CAREEROS_DATA_DIR: /tmp/careeros-data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=careeros_ci psql -h 127.0.0.1 -U careeros -d careeros -c "CREATE DATABASE careeros_test"
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
